rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  queue_name: "iso_downloads"

download:
  max_parallel: 3
  download_directory: "./downloads"
  chunk_size: 8192
  timeout: 300

worker:
  concurrency: 2  # Number of parallel download jobs per worker process

scheduler:
  frequency: "weekly"  # weekly, monthly, daily
  time: "02:00"       # 24-hour format
  resync_within_days: 90  # Re-sync existing directories last synced within this many days (0 = force all, omit to never re-sync)

iso_globs:
  # BSD Systems
  - name: "FreeBSD Archive"
    base_url: "rsync://ftp-archive.freebsd.org/FreeBSD-Archive/old-releases/"
    type: "rsync"
    mirror: true
    enabled: true
    include_patterns:
      - "*.iso"
      - "*.img"
    destination_dir: "/isos/freebsd"

  - name: "NetBSD Archive"
    base_url: "https://archive.netbsd.org/pub/NetBSD-archive/iso/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/netbsd"

  - name: "NetBSD Current"
    base_url: "http://cdn.netbsd.org/pub/NetBSD/iso/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/netbsd"

  - name: "OpenBSD Archive"
    base_url: "rsync://mirror.planetunix.net/OpenBSD-archive/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
      - "*.img"
    exclude_patterns:
      - "packages*"
    destination_dir: "/isos/openbsd"

  # Linux Distributions
  - name: "Debian Archive"
    base_url: "rsync://cdimage.debian.org/cdimage/archive/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/debian"

  - name: "Gentoo Releases"
    base_url: "rsync://ftp.swin.edu.au/gentoo/releases/x86/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/gentoo"

  - name: "XCP-ng"
    base_url: "https://updates.xcp-ng.org/isos/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/xcp-ng"

  - name: "Kali Linux"
    base_url: "http://old.kali.org/kali-images/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    exclude_patterns:
      - "*html*"
    destination_dir: "/isos/kali"

  - name: "CentOS Vault"
    base_url: "rsync://linuxsoft.cern.ch/centos-vault/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/centos"

  - name: "Fedora Archive"
    base_url: "rsync://archives.fedoraproject.org/fedora-archive/fedora/linux/releases/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/fedora"

  - name: "Slackware"
    base_url: "rsync://slackware.absolutehosting.net/pub/slackware/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/slackware"

  - name: "Arch Linux Archive"
    base_url: "https://archive.archlinux.org/iso/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    exclude_patterns:
      - "*html*"
    destination_dir: "/isos/archlinux"

  - name: "Alpine Linux"
    base_url: "http://dl-cdn.alpinelinux.org/alpine/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    exclude_patterns:
      - "*html*"
    destination_dir: "/isos/alpine"

  - name: "Knoppix"
    base_url: "rsync://ftp.nluug.nl/knoppix-cd/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/knoppix"

  - name: "Ubuntu Old Releases"
    base_url: "rsync://old-releases.ubuntu.com/old-releases/releases/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/ubuntu"

  - name: "openSUSE"
    base_url: "rsync://ftp.nluug.nl/opensuse/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/opensuse"

  - name: "Linux Mint"
    base_url: "rsync://ftp.nluug.nl/linuxmint/iso/stable/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.iso"
    destination_dir: "/isos/linuxmint"

  # Software/Kernels
  - name: "OpenSSL Source"
    base_url: "http://artfiles.org/openssl.org/source/old/"
    type: "http"
    mirror: true
    enabled: false
    include_patterns:
      - "*.tar.gz"
      - "*.tgz"
    destination_dir: "/isos/openssl"

  - name: "Linux Kernel"
    base_url: "rsync://rsync.kernel.org/pub/linux/kernel/"
    type: "rsync"
    mirror: true
    enabled: false
    include_patterns:
      - "*.tar.gz"
      - "*.tar.xz"
    destination_dir: "/isos/kernel"

  # Current/Active
  - name: "Debian ISOs"
    base_url: "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/"
    type: "http"
    mirror: true
    enabled: true
    exclude_patterns:
      - "*edu*"
      - "*mac*"
    destination_dir: "/isos/debian/current"

  - name: "CentOS Stream"
    base_url: "https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/iso/"
    type: "http"
    mirror: true
    enabled: true
    destination_dir: "/isos/centos/current"
